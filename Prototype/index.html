<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Finanças: protótipo</title>
<meta name="description" content="Protótipo navegável do MVP do App Finanças (iOS), direção visual Cédula.">
<style>
/* =========================================================
   Tokens "Cédula" (fonte da verdade: Design/tokens.json)
   ========================================================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;
  --sp-xxs:2px;--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:20px;--sp-xxl:24px;--sp-xxxl:32px;--sp-huge:48px;
  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:20px;--r-sheet:28px;--r-full:999px;
  --t-fast:.15s;--t-std:.25s;--t-sheet:.35s;--ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="light"]{
  --canvas:#EEF2EF;--surface:#FFFFFF;--surface-raised:#FFFFFF;--sunken:#E3E9E5;
  --text-primary:#15241F;--text-secondary:#4B5B55;--text-tertiary:#56645F;--text-on-brand:#FFFFFF;--text-on-danger:#FFFFFF;
  --separator:#CDD6D1;--border:#7F8E88;
  --brand-primary:#0D5C63;--brand-soft:#D8EAE8;--focus:#0D5C63;
  --income:#176E3C;--income-soft:#DDF0E3;--expense:#15241F;--transfer:#0D5C63;
  --warning:#8A5A00;--warning-fill:#A86A06;--warning-soft:#FBEBCF;
  --danger:#B42318;--danger-soft:#FBE3DF;--neutral:#56645F;
  --cat-moradia:#2E7D78;--cat-mercado:#B86F0B;--cat-transporte:#3A6EA5;--cat-lazer:#7653A8;--cat-saude:#B8456A;--cat-educacao:#8E6236;--cat-outros:#6E7479;
  --shadow-float:0 6px 20px rgba(21,36,31,.10);--shadow-sheet:0 -2px 24px rgba(21,36,31,.12);--shadow-seg:0 1px 3px rgba(21,36,31,.12);
  --scrim:rgba(21,36,31,.32);
  --page:#D3DBD7;--bezel:#1B2420;--bezel-edge:#3A4642;
  color-scheme:light;
}
[data-theme="dark"]{
  --canvas:#0E1513;--surface:#17201D;--surface-raised:#1F2A26;--sunken:#0A100E;
  --text-primary:#E7EEEA;--text-secondary:#A9B7B1;--text-tertiary:#8D9C96;--text-on-brand:#06292B;--text-on-danger:#2A0B08;
  --separator:#2C3934;--border:#6F7F79;
  --brand-primary:#5CC2C6;--brand-soft:#173A3B;--focus:#5CC2C6;
  --income:#57C98A;--income-soft:#16301F;--expense:#E7EEEA;--transfer:#5CC2C6;
  --warning:#F2B551;--warning-fill:#E8A33D;--warning-soft:#3A2C12;
  --danger:#FF8B7E;--danger-soft:#3D1D1A;--neutral:#8D9C96;
  --cat-moradia:#56B3AD;--cat-mercado:#E7A443;--cat-transporte:#77A6DA;--cat-lazer:#A88BD6;--cat-saude:#E07C9E;--cat-educacao:#C79A6A;--cat-outros:#9BA2A8;
  --shadow-float:none;--shadow-sheet:none;--shadow-seg:none;
  --scrim:rgba(0,0,0,.55);
  --page:#050807;--bezel:#26302C;--bezel-edge:#3C4843;
  color-scheme:dark;
}

/* ---------- Página (fora do iPhone) ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text-primary);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--separator);position:sticky;top:0;z-index:5}
.toolbar .brandname{display:flex;flex-direction:column;margin-right:auto}
.toolbar .brandname strong{font-size:17px}
.toolbar .brandname span{font-size:13px;color:var(--text-secondary)}
.tb-group{display:flex;align-items:center;gap:8px;border:0;margin:0;padding:0}
.tb-group legend,.tb-label{font-size:13px;color:var(--text-secondary);padding:0;margin-right:4px;float:left}
.tb-seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-sm);padding:2px}
.tb-seg label{position:relative}
.tb-seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tb-seg span{display:block;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--text-secondary)}
.tb-seg input:checked+span{background:var(--surface);color:var(--text-primary);font-weight:600;box-shadow:var(--shadow-seg)}
.tb-seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:1px}
.tb-select{height:36px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);padding:0 8px;font-size:14px}
.tb-btn{height:36px;border-radius:var(--r-full);border:1px solid var(--border);background:transparent;padding:0 14px;font-size:14px}

.stage{display:flex;justify-content:center;padding:16px 12px 32px}
.scaler{position:relative}
.device{position:absolute;top:0;left:0;transform-origin:top left;background:var(--bezel);box-shadow:0 0 0 2px var(--bezel-edge),0 30px 60px rgba(0,0,0,.25)}
.device[data-device="i16"]{--w:390px;--h:844px;--status-h:47px;--home-h:34px;--key-h:52px;--hero:48px;--lt:34px;padding:12px;border-radius:66px}
.device[data-device="i16"] .app{border-radius:54px}
.device[data-device="i16pm"]{--w:440px;--h:956px;--status-h:62px;--home-h:34px;--key-h:56px;--hero:50px;--lt:34px;padding:12px;border-radius:70px}
.device[data-device="i16pm"] .app{border-radius:58px}
.device[data-device="i12"]{--w:390px;--h:844px;--status-h:47px;--home-h:34px;--key-h:52px;--hero:48px;--lt:34px;padding:12px;border-radius:62px}
.device[data-device="i12"] .app{border-radius:50px}
.device[data-device="i12"] .island{top:12px;width:210px;height:30px;margin-left:-105px;border-radius:0 0 22px 22px}
.device[data-device="se"]{--w:375px;--h:667px;--status-h:20px;--home-h:0px;--key-h:44px;--hero:42px;--lt:30px;padding:72px 14px;border-radius:52px}
.device[data-device="se"] .app{border-radius:2px}
.device[data-device="se"]::after{content:"";position:absolute;left:50%;bottom:12px;width:50px;height:50px;margin-left:-25px;border-radius:50%;border:2px solid var(--bezel-edge)}
.device[data-device="se"]::before{content:"";position:absolute;left:50%;top:32px;width:60px;height:6px;margin-left:-30px;border-radius:3px;background:var(--bezel-edge)}
.island{position:absolute;top:23px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:30}
.device[data-device="se"] .island{display:none}

/* ---------- App ---------- */
.app{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--canvas);color:var(--text-primary);display:flex;flex-direction:column;font-size:17px;letter-spacing:-.01em}
.statusbar{flex:0 0 var(--status-h);display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 40px;font-size:16px;font-weight:600;letter-spacing:0}
.device[data-device="se"] .statusbar{padding:0 8px 2px;align-items:center;font-size:12px}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:28px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.homeind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text-primary);z-index:40;pointer-events:none}
.device[data-device="se"] .homeind{display:none}

/* Tab bar */
.tabbar[hidden]{display:none}
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px var(--home-h);background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:1px solid var(--separator);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.device[data-device="se"] .tabbar{padding-bottom:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border:0;background:none;color:var(--text-secondary);font-size:10.5px;font-weight:500;letter-spacing:0}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--brand-primary)}
.tab-new .plus{width:48px;height:48px;border-radius:50%;background:var(--brand-primary);color:var(--text-on-brand);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow-float)}
.tab-new .plus svg{width:26px;height:26px;stroke-width:2.4}
.tab-new{color:var(--text-secondary)}

/* Headers */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:6px 12px 4px 20px;min-height:52px}
.large-title{font-size:var(--lt);line-height:1.2;font-weight:700;letter-spacing:.01em;margin:0}
.actions{display:flex;gap:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--brand-primary);display:grid;place-items:center}
.icon-btn svg{width:24px;height:24px}
.navbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;padding:0 8px}
.back{display:flex;align-items:center;gap:0;border:0;background:none;color:var(--brand-primary);font-size:17px;min-height:44px;padding:0 8px 0 0;justify-self:start}
.back svg{width:26px;height:26px;stroke-width:2.2}
.nav-title{font-size:17px;font-weight:600;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}

/* Sections & groups */
.sec{margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 8px}
.sec-title{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}
.sec-link{border:0;background:none;color:var(--brand-primary);font-size:15px;min-height:44px;padding:0;margin:-12px 0}
.group-label{font-size:13px;font-weight:600;color:var(--text-secondary);margin:0;padding:20px 20px 6px;display:flex;justify-content:space-between;gap:8px}
.group-label .amt{font-weight:500;font-size:13px;color:var(--text-secondary)}
.group{background:var(--surface);border-radius:var(--r-md);margin:0 16px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;border:0;background:transparent;text-align:left}
button.row,label.row{cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:60px;height:1px;background:var(--separator)}
.row.plain+.row.plain::before,.row.plain+.row::before{left:16px}
.row .main{flex:1;min-width:0}
.t1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:18px;height:18px;color:var(--text-tertiary);flex:none}
.note{font-size:13px;color:var(--text-secondary);padding:8px 20px 0;margin:0}

.ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c,var(--neutral));background:color-mix(in srgb,var(--c,var(--neutral)) 15%,var(--surface))}
.ico svg{width:19px;height:19px}

/* Números */
.num,.amt{font-variant-numeric:tabular-nums}
.amt{font-weight:500;white-space:nowrap;text-align:right;font-size:17px}
.amt.income{color:var(--income)}
.amt.transfer{color:var(--transfer)}
.amt.neg{color:var(--danger)}
.amt.zero{color:var(--text-secondary)}
.amt-sub{display:block;font-size:13px;color:var(--text-secondary);font-weight:400;text-align:right;margin-top:2px}
.amt-split{display:inline-flex;align-items:flex-start;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.amt-split .int{font-weight:600;letter-spacing:-.025em}
.amt-split .sym,.amt-split .frac{font-size:.45em;font-weight:500;margin-top:.14em;letter-spacing:0}
.amt-split .sym{margin-right:.12em}
.amt-split .frac{margin-left:.04em}
.amt-split.xl{font-size:var(--hero)}
.amt-split.large{font-size:28px}
.amt-split.large .sym,.amt-split.large .frac{font-size:.55em;margin-top:.1em}
.amt-split.neg{color:var(--danger)}
.amt-split .ghost{color:var(--text-tertiary)}
.income{color:var(--income)}
.warn-text{color:var(--warning)}
.danger-text{color:var(--danger)}

/* Hero */
.hero{padding:16px 20px 0}
.hero-label{font-size:15px;color:var(--text-secondary);margin:0 0 6px}
.hero-amt{margin:0}
.hero-sub{font-size:15px;color:var(--text-secondary);margin:10px 0 0}
.hero-sub strong{font-weight:600;font-variant-numeric:tabular-nums}

/* Controles */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:var(--r-full);border:0;font-size:17px;font-weight:600;padding:0 20px;width:100%}
.btn-primary{background:var(--brand-primary);color:var(--text-on-brand)}
.btn-primary[aria-disabled="true"]{opacity:.45}
.btn-secondary{background:var(--brand-soft);color:var(--brand-primary)}
.btn-small{min-height:36px;width:auto;font-size:15px;padding:0 14px;position:relative}
.btn-small::after{content:"";position:absolute;inset:-4px 0}
.link-btn{border:0;background:none;color:var(--brand-primary);font-size:17px;min-height:44px;padding:0 4px}
.chips{display:flex;gap:8px;padding:4px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:4px 16px}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);font-size:15px;color:var(--text-primary);white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"],.chip[aria-checked="true"],.chip[aria-selected="true"]{background:var(--brand-soft);border-color:var(--brand-primary);color:var(--brand-primary);font-weight:600}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .count{min-width:20px;height:20px;border-radius:10px;background:var(--brand-primary);color:var(--text-on-brand);font-size:12px;display:grid;place-items:center;padding:0 5px;font-weight:600}
.seg{display:flex;background:var(--sunken);border-radius:var(--r-sm);padding:2px;margin:0 16px}
.seg button{position:relative;flex:1;height:34px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--text-secondary)}
.seg button::after{content:"";position:absolute;inset:-5px 0}
.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--surface);color:var(--text-primary);font-weight:600;box-shadow:var(--shadow-seg)}
[data-theme="dark"] .seg button[aria-selected="true"],[data-theme="dark"] .seg button[aria-checked="true"]{background:var(--surface-raised)}
.field{display:block;width:100%;height:44px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--sunken);padding:0 12px;font-size:17px;color:var(--text-primary)}
.field::placeholder{color:var(--text-tertiary)}
.field:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-radius:var(--r-sm)}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin:0 0 6px}
.field-wrap{padding:0 20px;margin-top:20px}
.prefix-field{display:flex;align-items:center;background:var(--sunken);border-radius:var(--r-sm)}
.prefix-field span{padding-left:12px;color:var(--text-secondary)}
.prefix-field .field{background:transparent;font-variant-numeric:tabular-nums}
.error{color:var(--danger);font-size:13px;margin:6px 0 0}
.switch{flex:none;position:relative;width:51px;height:31px;border-radius:16px;border:0;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--border);padding:0}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform var(--t-fast) var(--ease)}
.switch[aria-checked="true"]{background:var(--brand-primary);box-shadow:none}
.switch[aria-checked="true"]::before{transform:translateX(20px)}
.switch:focus-visible{border-radius:16px}
.select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--text-secondary);font-size:17px;text-align:right;padding:8px 0;min-height:44px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-full);font-size:12px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--income-soft);color:var(--income)}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.neutral{background:var(--sunken);color:var(--text-secondary)}
.badge.brand{background:var(--brand-soft);color:var(--brand-primary)}
.bar{position:relative;height:8px;border-radius:var(--r-full);background:var(--sunken);overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);background:var(--c,var(--brand-primary))}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-tertiary);border-radius:1px}
.empty{padding:40px 32px;text-align:center;color:var(--text-secondary)}
.empty h2{font-size:20px;color:var(--text-primary);margin:0 0 8px}
.empty p{margin:0 0 16px;font-size:15px}

/* Busca */
.search{display:flex;align-items:center;gap:6px;margin:8px 16px 8px;background:var(--sunken);border-radius:var(--r-sm);padding:0 10px}
.search svg{width:18px;height:18px;color:var(--text-secondary);flex:none}
.search input{flex:1;border:0;background:transparent;height:40px;font-size:17px;min-width:0}
.search input::placeholder{color:var(--text-tertiary)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{outline:2px solid var(--focus);outline-offset:0}
.search input:focus-visible{outline:none}
.list-summary{font-size:13px;color:var(--text-secondary);padding:8px 20px 0;margin:0}

/* Blocos destacados (fatura, metas) */
.panel{background:var(--surface);border-radius:var(--r-lg);margin:12px 16px 0;padding:18px 16px 16px}
.panel h3{font-size:17px;font-weight:600;margin:0}
.panel .meta{font-size:13px;color:var(--text-secondary);margin:2px 0 0}
.panel .row-actions{display:flex;gap:8px;margin-top:16px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text-secondary);margin-top:8px}
.kv .num{color:var(--text-primary);font-weight:500}
.plastic{width:44px;height:30px;border-radius:5px;background:var(--brand-primary);position:relative;flex:none}
.plastic::after{content:"";position:absolute;left:6px;top:9px;width:9px;height:7px;border-radius:2px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.plastic.alt{background:var(--cat-transporte)}

/* Calendário */
.cal{background:var(--surface);border-radius:var(--r-md);margin:12px 16px 0;padding:8px 8px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.cal-head h3{font-size:17px;font-weight:600;margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px}
.cal-wd{text-align:center;font-size:12px;color:var(--text-secondary);padding:4px 0}
.cal-day{position:relative;height:44px;border:0;border-radius:10px;background:transparent;font-size:16px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-primary);padding:0}
.cal-day.today .dn{background:var(--text-primary);color:var(--canvas);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:600}
.cal-day[aria-pressed="true"]{background:var(--brand-soft)}
.cal-day .dots{display:flex;gap:3px;height:6px}
.cal-day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cal-day:disabled{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-secondary);padding:8px 20px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* Onboarding */
.ob{display:flex;flex-direction:column;min-height:100%;padding:8px 0 0}
.ob-progress{display:flex;gap:6px;padding:12px 20px 0}
.ob-progress i{flex:1;height:4px;border-radius:2px;background:var(--sunken)}
.ob-progress i.on{background:var(--brand-primary)}
.ob-step{font-size:13px;color:var(--text-secondary);padding:10px 20px 0;margin:0}
.ob-title{font-size:var(--lt);line-height:1.15;font-weight:700;margin:16px 20px 0;letter-spacing:-.01em}
.ob-body{font-size:17px;color:var(--text-secondary);margin:12px 20px 0;line-height:1.4}

const accById = id => S.accounts.find(a => a.id === id);
const cardById = id => S.cards.find(c => c.id === id);
const srcName = id => (accById(id) || cardById(id) || { name: '' }).name;
const inOct = tx => tx.date >= '2026-10-01' && tx.date <= '2026-10-31';
const octTx = () => S.txs.filter(inOct);
const sum = (arr, f = x => x.cents) => arr.reduce((a, x) => a + f(x), 0);
const incomeOct = () => sum(octTx().filter(t => t.kind === 'income'));
const expenseOct = () => sum(octTx().filter(t => t.kind === 'expense'));
const spentBy = cat => sum(octTx().filter(t => t.kind === 'expense' && t.cat === cat));
const liquidTotal = () => sum(S.accounts.filter(a => a.type !== 'investimento'), a => a.bal);

function cycle(card, off = 0) {
  const t = parseISO(TODAY);
  const y = t.getFullYear();
  let m = t.getMonth() + (t.getDate() >= card.close ? 1 : 0) + off;
  const close = new Date(y, m, card.close);
  const start = new Date(y, m - 1, card.close);
  const end = new Date(y, m, card.close - 1);
  const due = new Date(y, card.due < card.close ? m + 1 : m, card.due);
  return { start: iso(start), end: iso(end), close: iso(close), due: iso(due), key: iso(close) };
}
function invoiceItems(card, off) {
  const cur = cycle(card, 0);
  const base = S.txs.filter(x => x.acc === card.id && x.kind === 'expense' && x.date >= cur.start && x.date <= cur.end);
  if (off <= 0) return base;
  return base.filter(x => (x.parcel && x.parcel.cur + off <= x.parcel.of) || x.recur)
    .map(x => ({ ...x, parcel: x.parcel ? { cur: x.parcel.cur + off, of: x.parcel.of } : null, future: true }));
}
const invoiceTotal = (card, off) => sum(invoiceItems(card, off));
const paidOn = (card, off = 0) => card.paid[cycle(card, off).key] || 0;
const invoiceOpen = card => Math.max(0, invoiceTotal(card, 0) - paidOn(card, 0));
const futureParcels = card => sum(invoiceItems(card, 0).filter(x => x.parcel), x => x.cents * (x.parcel.of - x.parcel.cur));
const available = card => card.limit - invoiceOpen(card) - futureParcels(card);

function billView(b) {
  if (b.card) {
    const card = cardById(b.card), c = cycle(card, 0);
    const total = invoiceTotal(card, 0);
    return { ...b, name: 'Fatura ' + card.name, cents: invoiceOpen(card), due: c.due, paid: total > 0 && invoiceOpen(card) === 0, cat: null, isCard: true };
  }
  return b;
}
function billStatus(b) {
  if (b.paid) return { k: 'paid', label: b.receive ? 'Recebido' : 'Pago', cls: 'ok', color: 'var(--income)' };
  const d = diffDays(b.due, TODAY);
  if (d < 0) return { k: 'late', label: b.receive ? 'Recebimento atrasado' : `Atrasado ${-d} ${-d === 1 ? 'dia' : 'dias'}`, cls: 'danger', color: 'var(--danger)' };
  if (b.receive) return { k: 'receive', label: 'A receber', cls: 'brand', color: 'var(--brand-primary)' };
  if (d === 0) return { k: 'soon', label: 'Vence hoje', cls: 'warn', color: 'var(--warning-fill)' };
  if (d <= 3) return { k: 'soon', label: d === 1 ? 'Vence amanhã' : `Vence em ${d} dias`, cls: 'warn', color: 'var(--warning-fill)' };
  return { k: 'pending', label: 'Pendente', cls: 'neutral', color: 'var(--neutral)' };
}
const bills = () => S.bills.map(billView).sort((a, b) => a.due.localeCompare(b.due));

function budgetState(cat) {
  const lim = S.budgets[cat], sp = spentBy(cat), pct = lim ? sp / lim : 0;
  if (pct >= 1) return { lim, sp, pct, k: 'over', cls: 'danger', fill: 'var(--danger)', label: sp === lim ? '100% usado' : `Estourou ${money(sp - lim)}` };
  if (pct >= .8) return { lim, sp, pct, k: 'warn', cls: 'warn', fill: 'var(--warning-fill)', label: `${Math.floor(pct * 100)}% usado` };
  return { lim, sp, pct, k: 'ok', cls: 'neutral', fill: CATS[cat].color, label: `Restam ${money(lim - sp)}` };
}
function budgetAlert(cat, before) {
  if (!S.budgets[cat]) return null;
  const lim = S.budgets[cat], after = spentBy(cat);
  if (before < lim && after >= lim) return { msg: `${CATS[cat].name} passou do orçamento do mês.`, kind: 'danger' };
  if (before < lim * .8 && after >= lim * .8) return { msg: `${CATS[cat].name} chegou a ${Math.floor(after / lim * 100)}% do orçamento.`, kind: 'warn' };
  return null;
}

const screenEl = () => $('#screen');
let lastRoute = '';
function render(routeChanged) {
  const key = S.route + '|' + S.planTab + '|' + S.walletTab + '|' + S.obStep;
  const changed = routeChanged || key !== lastRoute;
  const sc = screenEl();
  const prevScroll = sc.scrollTop;
  const activeId = document.activeElement && document.activeElement.id;
  let html = '';
  switch (S.route) {
    case 'onboarding': html = vOnboarding(); break;
    case 'home': html = vHome(); break;
    case 'transactions': html = vTransactions(); break;
    case 'plan': html = vPlan(); break;
    case 'wallet': html = vWallet(); break;
    case 'invoice': html = vInvoice(); break;
    case 'settings': html = vSettings(); break;
  }
  sc.innerHTML = html;
  sc.dataset.screen = currentScreenId();
  renderTabbar();
  renderLock();
  if (changed) {
    sc.scrollTop = 0;
    if (!S.sheet && !S.locked) { const h = $('#h', sc); if (h) h.focus({ preventScroll: true }); }
  } else {
    sc.scrollTop = prevScroll;
    if (activeId && !S.sheet) { const el = document.getElementById(activeId); if (el) el.focus({ preventScroll: true }); }
  }
  lastRoute = key;
  $('#jump').value = currentScreenId();
  if (S.route === 'home') animateHero();
}

function renderTabbar() {
  const tb = $('#tabbar');
  const hide = S.route === 'onboarding' || S.locked;
  tb.hidden = hide;
  if (hide) { tb.innerHTML = ''; return; }
  const active = { home: 'home', settings: 'home', transactions: 'transactions', plan: 'plan', wallet: 'wallet', invoice: 'wallet' }[S.route];
  const tabs = [['home','Início','home'],['transactions','Lançamentos','list'],['new','Novo','plus'],['plan','Planejar','target'],['wallet','Carteira','wallet']];
  tb.innerHTML = tabs.map(([id, label, ic]) => id === 'new'
    ? `<button type="button" class="tab tab-new" id="tab-new" data-act="open-new" aria-label="Novo lançamento"><span class="plus">${icon('plus')}</span><span aria-hidden="true">Novo</span></button>`
    : `<button type="button" class="tab" id="tab-${id}" data-act="tab" data-v="${id}" ${active === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`
  ).join('');
}

function renderLock() {
  let lk = $('#lockscreen');
  if (!S.locked) { if (lk) lk.remove(); screenEl().inert = !!S.sheet; return; }
  if (!lk) {
    lk = document.createElement('div');
    lk.id = 'lockscreen'; lk.className = 'lock'; lk.setAttribute('role', 'dialog'); lk.setAttribute('aria-modal', 'true'); lk.setAttribute('aria-labelledby', 'lock-t');

const DEVICE_W = { i16pm: 440, i12: 390, i16: 390, se: 375 };
const chartW = () => (DEVICE_W[S.device] || 390) - 40;
function chartIncomeExpense(inc, exp) {
  const W = chartW(), max = Math.max(inc, exp, SEPT.income, SEPT.expense) || 1;
  const rows = [['Receitas', inc, SEPT.income, 'var(--income)'], ['Despesas', exp, SEPT.expense, 'var(--text-primary)']];
  const RH = 46;
  const desc = rows.map(r => `${r[0]}: ${spoken(r[1])}; setembro: ${spoken(r[2])}`).join('. ');
  return `<svg class="chart" viewBox="0 0 ${W} ${RH * 2}" width="${W}" height="${RH * 2}" role="img" aria-labelledby="ie-t ie-d"><desc id="ie-d">${esc(desc)}</desc>
  ${rows.map((r, i) => {
    const y = i * RH, w = Math.max(4, r[1] / max * W), sx = r[2] / max * W;
    return `<text x="0" y="${y + 16}" font-size="15" style="fill:var(--text-secondary)">${r[0]}</text>
      <text x="${W}" y="${y + 16}" font-size="15" font-weight="600" text-anchor="end" style="fill:var(--text-primary)">${esc(money(r[1]))}</text>
      <rect x="0" y="${y + 24}" width="${W}" height="10" rx="5" style="fill:var(--sunken)"/>

      <rect x="${Math.min(W - 2, sx - 1)}" y="${y + 20}" width="2" height="18" rx="1" style="fill:var(--text-tertiary)"/>`;
  }).join('')}</svg>`;
}
function chartCategories() {
  const W = chartW();
  const data = EXP_CATS.map(c => ({ c, v: spentBy(c), p: SEPT.cat[c] || 0 })).filter(d => d.v > 0).sort((a, b) => b.v - a.v);
  const max = Math.max(...data.map(d => Math.max(d.v, d.p)), 1);
  const RH = 46;
  const desc = data.map(d => `${CATS[d.c].name}: ${spoken(d.v)}, ${deltaWord(d.v, d.p)}`).join('. ');
  return `<svg class="chart" viewBox="0 0 ${W} ${RH * data.length}" width="${W}" height="${RH * data.length}" role="img" aria-labelledby="cat-t cat-d"><desc id="cat-d">${esc(desc)}</desc>
  ${data.map((d, i) => {
    const y = i * RH, w = Math.max(4, d.v / max * W), sx = d.p / max * W;
    const pct = d.p ? Math.round((d.v - d.p) / d.p * 100) : null;
    const dl = pct === null ? 'novo' : pct === 0 ? 'igual' : (pct > 0 ? '↑ ' : '↓ ') + Math.abs(pct) + '%';
    return `<text x="0" y="${y + 16}" font-size="15" style="fill:var(--text-primary)">${CATS[d.c].name}<tspan dx="8" font-size="13" style="fill:var(--text-secondary)">${S.hidden ? '' : dl}</tspan></text>
      <text x="${W}" y="${y + 16}" font-size="15" font-weight="500" text-anchor="end" style="fill:var(--text-primary)">${esc(money(d.v))}</text>
      <rect x="0" y="${y + 25}" width="${W}" height="8" rx="4" style="fill:var(--sunken)"/>
      <rect x="0" y="${y + 25}" width="${w}" height="8" rx="4" style="fill:${CATS[d.c].color}"/>
      ${d.p ? `<rect x="${Math.min(W - 2, sx - 1)}" y="${y + 21}" width="2" height="16" rx="1" style="fill:var(--text-tertiary)"/>` : ''}`;
  }).join('')}</svg>`;
}
function deltaWord(v, p) {
  if (!p) return 'sem gasto em setembro';
  const pct = Math.round((v - p) / p * 100);
  return pct === 0 ? 'igual a setembro' : `${Math.abs(pct)}% ${pct > 0 ? 'a mais' : 'a menos'} que setembro`;
}
function animateHero() {
  if (S.heroAnimated || S.hidden) return;
  S.heroAnimated = true;
  if (reduced()) return;
  const el = $('#hero-amt .int'); if (!el) return;

/* ---------- Lançamentos ---------- */
function filteredTx() {
  const f = S.f, q = f.q.trim().toLowerCase();
  const min = parseReais(f.min), max = parseReais(f.max);
  return S.txs.filter(t => {
    if (f.period === 'month' && !inOct(t)) return false;
    if (f.period === 'last' && !(t.date >= '2026-09-01' && t.date <= '2026-09-30')) return false;
    if (f.period === '90' && t.date < addDays(TODAY, -90)) return false;
    if (f.type !== 'all' && !(t.kind === f.type || (f.type === 'transfer' && t.kind === 'invoice'))) return false;
    if (f.accounts.length && !f.accounts.includes(t.acc) && !f.accounts.includes(t.to)) return false;
    if (f.cats.length && !f.cats.includes(t.cat)) return false;
    if (min && t.cents < min) return false;
    if (max && t.cents > max) return false;
    if (f.tag && t.tag !== f.tag) return false;
    if (q) {
      const hay = [t.desc, t.cat && CATS[t.cat].name, t.tag, srcName(t.acc)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id, undefined, { numeric: true }));
}
const activeFilterCount = () => { const f = S.f; return (f.period !== 'month') + (f.type !== 'all') + (f.accounts.length > 0) + (f.cats.length > 0) + (!!(f.min || f.max)) + (!!f.tag); };
function txRow(t) {
  let ic, c, sub;
  if (t.kind === 'transfer') { ic = 'arrows'; c = 'var(--transfer)'; sub = `${srcName(t.acc)} para ${srcName(t.to)}`; }
  else if (t.kind === 'invoice') { ic = 'card'; c = 'var(--transfer)'; sub = `Saiu de ${srcName(t.acc)}`; }
  else { ic = CATS[t.cat].icon; c = CATS[t.cat].color; sub = `${CATS[t.cat].name}, ${srcName(t.acc)}`; }
  const extra = [t.parcel ? `${t.parcel.cur}/${t.parcel.of}` : '', t.recur ? 'mensal' : '', t.tag ? '#' + t.tag : ''].filter(Boolean).join(', ');
  return `<div class="row" role="listitem"><span class="ico" style="--c:${c}">${icon(ic)}</span>
    <div class="main"><div class="t1">${esc(t.desc)}${t.parcel ? `<span class="sr-only">, parcela ${t.parcel.cur} de ${t.parcel.of}</span>` : ''}</div><div class="t2">${esc(sub)}${extra ? ', ' + esc(extra) : ''}</div></div>
    ${rowAmt(t)}</div>`;
}
function txListHtml() {
  const list = filteredTx();
  if (!list.length) {
    const msg = S.f.period === 'last' ? 'Este protótipo só tem lançamentos de outubro.' : 'Nada encontrado com essa busca e esses filtros.';
    return `<div class="empty"><h2>Nenhum lançamento</h2><p>${msg}</p><button type="button" class="btn btn-secondary btn-small" id="clear-f2" data-act="clear-filters">Limpar busca e filtros</button></div>`;

function vAccounts() {

function vCards() {

  }).join('');
}
function vInvoice() {
  const card = cardById(S.inv.card), off = S.inv.off;
  const offs = [-1, 0, 1, 2];
  const lbl = o => { const c = cycle(card, o); const d = parseISO(c.due); return cap(MONTHS[d.getMonth()]); };
  const c = cycle(card, off);
  let status, total, items = [];
  if (off < 0) { total = card.prev.total; status = { t: `Paga em ${fmtDay(card.prev.paidOn)}`, cls: 'ok' }; }
  else if (off === 0) { items = invoiceItems(card, 0); total = invoiceTotal(card, 0); const open = invoiceOpen(card); status = open === 0 && total ? { t: 'Paga', cls: 'ok' } : { t: 'Aberta', cls: 'neutral' }; }
  else { items = invoiceItems(card, off); total = sum(items); status = { t: 'Futura', cls: 'brand' }; }
  const paidPart = off === 0 ? paidOn(card, 0) : 0;
  return `<div data-screen="wallet.cardInvoice">
  <div class="navbar"><button type="button" class="back" id="back" data-act="nav" data-v="wallet.cards">${icon('chevL')}Carteira</button><h1 class="nav-title" id="h" tabindex="-1">${esc(card.name)}</h1><span></span></div>
  <div class="chips" role="tablist" aria-label="Faturas" style="padding-top:8px">
    ${offs.map(o => `<button type="button" class="chip" role="tab" id="io-${o + 1}" aria-selected="${o === off}" tabindex="${o === off ? 0 : -1}" data-act="inv-off" data-v="${o}">${lbl(o)}</button>`).join('')}
  </div>
  <section class="hero" aria-labelledby="inv-l">
    <p class="hero-label" id="inv-l">Fatura de ${lbl(off).toLowerCase()} <span class="badge ${status.cls}" style="margin-left:6px">${status.t}</span></p>
    <p class="hero-amt">${split(total)}</p>
    <p class="hero-sub">${off < 0 ? `Fechou ${fmtDay(cycle(card, -1).close)}` : `Fecha ${fmtDay(c.close)}`}, vence ${fmtDay(c.due)}</p>
    ${paidPart && paidPart < total ? `<p class="hero-sub">Já pago ${money(paidPart)}, falta ${money(total - paidPart)}</p>` : ''}
    ${off === 0 && invoiceOpen(card) ? `<div style="margin-top:16px"><button type="button" class="btn btn-primary" id="pay-now" data-act="pay-open" data-v="${card.id}">Pagar fatura</button></div>` : ''}
  </section>
  ${off < 0 ? `<p class="note" style="padding-top:24px">Os lançamentos de faturas pagas ficam em Lançamentos, filtrando pelo cartão.</p>` :
    items.length ? `<h2 class="group-label"><span>${off > 0 ? 'Parcelas e assinaturas previstas' : 'Compras desta fatura'}</span><span>${items.length}</span></h2>
    <div class="group" role="list">${items.sort((a, b) => b.date.localeCompare(a.date)).map(t => `<div class="row" role="listitem"><span class="ico" style="--c:${CATS[t.cat].color}">${icon(CATS[t.cat].icon)}</span>
      <div class="main"><div class="t1">${esc(t.desc)}</div><div class="t2">${t.future ? '' : fmtDay(t.date) + ', '}${CATS[t.cat].name}${t.parcel ? `, parcela ${t.parcel.cur} de ${t.parcel.of}` : ''}${t.recur ? ', assinatura' : ''}</div></div>
      ${rowAmt(t)}</div>`).join('')}</div>` : `<div class="empty"><p>Nenhuma compra nesta fatura ainda.</p></div>`}
  </div>`;
}

/* =========================================================
   Sheets
   ========================================================= */
let opener = null;
function openSheet(kind, data = {}) {
  opener = document.activeElement;
  S.sheet = { kind, ...data, fresh: true };
  if (kind === 'new') S.sheet.d = { kind: 'expense', amt: '', desc: '', cat: null, suggested: false, acc: 'nu', to: 'poup', date: TODAY, repeat: 'none', n: 2, tag: '', panel: null, error: '' };
  if (kind === 'pay') S.sheet.p = { opt: 'total', other: '', acc: 'nu' };
  if (kind === 'goal') S.sheet.g = { amt: 10000, acc: 'nu' };
  renderSheet();
  const t = $('#sheet-title'); if (t) t.focus({ preventScroll: true });
}
function closeSheet(silent) {
  if (!S.sheet) return;
  S.sheet = null;
  $('#layer').innerHTML = '';
  screenEl().inert = false; $('#tabbar').inert = false;
  $('#jump').value = currentScreenId();
  if (!silent) {
    if (opener && document.contains(opener)) opener.focus({ preventScroll: true });
    else { const h = $('#h'); if (h) h.focus({ preventScroll: true }); }
  }
}
function renderSheet() {
  const sh = S.sheet; if (!sh) return;
  const activeId = document.activeElement && document.activeElement.id;
  const fresh = sh.fresh; sh.fresh = false;
  let inner = '', cls = '', sid = '';
  if (sh.kind === 'new') { inner = vNew(); sid = 'transaction.new'; }
  if (sh.kind === 'filters') { inner = vFilters(); sid = 'transactions.filters'; }
  if (sh.kind === 'pay') { inner = vPay(); sid = 'wallet.payInvoice'; }
  if (sh.kind === 'goal') { inner = vGoal(); sid = 'plan.goals.contribute'; cls = 'short'; }
  $('#layer').innerHTML = `<div class="scrim ${fresh ? 'enter' : ''}" data-act="close-sheet" aria-hidden="true"></div>
    <div class="sheet ${cls} ${fresh ? 'enter' : ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-screen="${sid}" id="sheet">${inner}</div>`;
  screenEl().inert = true; $('#tabbar').inert = true;
  $('#jump').value = sid;
  if (!fresh && activeId) { const el = document.getElementById(activeId); if (el) el.focus({ preventScroll: true }); }
}

/* ---------- Novo lançamento ---------- */
const amtCents = s => { if (!s) return 0; const [i, f = ''] = s.split(','); return (parseInt(i || '0', 10) * 100) + parseInt((f + '00').slice(0, 2), 10); };
function vNew() {
  const d = S.sheet.d;
  const cents = amtCents(d.amt);
  const [i, f] = d.amt.split(',');
  const intPart = intStr(parseInt(i || '0', 10));
  const hasComma = d.amt.includes(',');
  const fracTyped = hasComma ? (f || '') : '';
  const fracGhost = '00'.slice(fracTyped.length);
  const kindLabel = { expense: 'despesa', income: 'receita', transfer: 'transferência' }[d.kind];
  const sources = d.kind === 'expense' ? [...S.accounts.filter(a => a.type !== 'investimento'), ...S.cards] : S.accounts;
  const isCard = !!cardById(d.acc);
  const cats = d.kind === 'income' ? INC_CATS : EXP_CATS;
  const dateLabel = d.date === TODAY ? 'Hoje' : d.date === addDays(TODAY, -1) ? 'Ontem' : fmtDay(d.date);
  const repLabel = { none: 'Não repete', parcel: `${d.n}x`, monthly: 'Todo mês', weekly: 'Toda semana' }[d.repeat];
  const pill = (id, ic, label, text) => `<button type="button" class="pill" id="pill-${id}" data-act="panel" data-v="${id}" aria-expanded="${d.panel === id}" aria-controls="nt-bottom" aria-label="${label}: ${esc(text)}">${icon(ic)}<span>${esc(text)}</span></button>`;
  const saveDisabled = cents <= 0;

  let bottom;
  if (!d.panel) {
    const k = (v, label, content) => `<button type="button" class="key" id="kp-${v === ',' ? 'comma' : v}" data-act="kp" data-v="${v}" ${label ? `aria-label="${label}"` : ''}>${content || v}</button>`;
    bottom = `<div class="keypad" role="group" aria-label="Teclado numérico">${['1','2','3','4','5','6','7','8','9'].map(n => k(n)).join('')}${k(',', 'vírgula')}${k('0')}${k('del', 'apagar', icon('backspace'))}</div>`;
  } else {
    let title = '', body = '';
    if (d.panel === 'acc' || d.panel === 'to') {
      title = d.panel === 'to' ? 'Para qual conta' : d.kind === 'transfer' ? 'De qual conta' : d.kind === 'income' ? 'Entrou em' : 'Pago com';
      const list = d.panel === 'to' ? S.accounts.filter(a => a.id !== d.acc) : sources;
      const cur = d.panel === 'to' ? d.to : d.acc;
      body = `<div class="group" role="radiogroup" aria-label="${title}">${list.map(a => `<button type="button" class="row plain" role="radio" id="acc-${d.panel}-${a.id}" aria-checked="${cur === a.id}" data-act="pick-acc" data-v="${a.id}">
        <span class="ico" style="--c:var(--brand-primary)">${icon(a.limit ? 'card' : ACC_ICON[a.type])}</span><div class="main"><div class="t1">${esc(a.name)}</div><div class="t2">${a.limit ? 'Cartão de crédito, disponível ' + money(available(a)) : ACC_TYPES[a.type]}</div></div><span class="radio-mark" aria-hidden="true"></span></button>`).join('')}</div>`;
    }
    if (d.panel === 'date') {
      title = 'Data';
      body = `<div class="chips wrap" role="radiogroup" aria-label="Data rápida">${[[TODAY,'Hoje'],[addDays(TODAY,-1),'Ontem'],[addDays(TODAY,-2),'Anteontem']].map(([v, l]) => `<button type="button" class="chip" role="radio" id="dt-${l}" aria-checked="${d.date === v}" data-act="pick-date" data-v="${v}">${l}</button>`).join('')}</div>
        <div class="field-wrap" style="margin-top:12px;padding:0 16px"><label class="field-label" for="nt-date">Outra data</label><input type="date" class="field" id="nt-date" data-in="nt-date" value="${d.date}"></div>`;
    }
    if (d.panel === 'repeat') {
      title = 'Repetir';
      const opts = [['none','Não repete',''],['parcel','Parcelado', isCard ? 'No cartão, cada parcela cai numa fatura' : 'Divide o valor em parcelas mensais'],['monthly','Todo mês','Recorrente, ex.: assinatura'],['weekly','Toda semana','']];
      body = `<div class="group" role="radiogroup" aria-label="Repetir">${opts.map(([v, l, s]) => `<button type="button" class="row plain" role="radio" id="rp-${v}" aria-checked="${d.repeat === v}" data-act="pick-repeat" data-v="${v}"><div class="main"><div class="t1">${l}</div>${s ? `<div class="t2">${s}</div>` : ''}</div><span class="radio-mark" aria-hidden="true"></span></button>`).join('')}</div>
        ${d.repeat === 'parcel' ? `<div class="row plain" style="margin-top:4px"><div class="main"><div class="t1" id="np-l">Parcelas</div><div class="t2 num">${cents ? `${d.n}x de ${money(Math.floor(cents / d.n), { force: true })}` : 'Digite o valor total'}</div></div>
          <div class="stepper" role="group" aria-labelledby="np-l"><button type="button" id="np-dec" data-act="n" data-v="-1" aria-label="Menos uma parcela">−</button><output aria-live="polite" class="num">${d.n}</output><button type="button" id="np-inc" data-act="n" data-v="1" aria-label="Mais uma parcela">+</button></div></div>` : ''}`;
    }
    if (d.panel === 'tag') {
      title = 'Tag';
      body = `<div class="chips wrap" role="radiogroup" aria-label="Tags">${['', ...TAGS].map(t => `<button type="button" class="chip" role="radio" id="tg-${t || 'none'}" aria-checked="${d.tag === t}" data-act="pick-tag" data-v="${t}">${t ? '#' + t : 'Sem tag'}</button>`).join('')}</div>
        <div class="field-wrap" style="margin-top:12px;padding:0 16px"><label class="field-label" for="nt-tag">Nova tag</label><input class="field" id="nt-tag" data-in="nt-tag" placeholder="ex.: reforma" autocomplete="off" value="${TAGS.includes(d.tag) ? '' : esc(d.tag)}"></div>`;
    }
    bottom = `<div class="nt-panel"><div class="panel-head"><h3 id="panel-t" tabindex="-1">${title}</h3><button type="button" class="link-btn" id="panel-done" data-act="panel" data-v="">Pronto</button></div>${body}</div>`;
  }

  return `<div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head"><button type="button" class="link-btn" id="nt-cancel" data-act="close-sheet">Cancelar</button><h2 id="sheet-title" tabindex="-1">Novo lançamento</h2><span></span></div>
  <div class="nt">
    <div class="seg" role="radiogroup" aria-label="Tipo de lançamento">
      ${[['expense','Despesa'],['income','Receita'],['transfer','Transferência']].map(([v, l]) => `<button type="button" role="radio" id="nk-${v}" aria-checked="${d.kind === v}" data-act="nkind" data-v="${v}">${l}</button>`).join('')}
    </div>
    <div class="nt-amount"><span class="sr-only" aria-live="polite">Valor: ${spoken(cents, { force: true })}</span>
      <span class="amt-split" aria-hidden="true" style="${d.kind === 'income' ? 'color:var(--income)' : ''}"><span class="sym">${d.kind === 'expense' ? MINUS : d.kind === 'income' ? '+' : ''}R$</span><span class="int ${d.amt ? '' : 'ghost'}">${intPart}</span>${hasComma ? '' : '<span class="caret"></span>'}<span class="frac"><span class="${hasComma || d.amt ? '' : 'ghost'}">,</span>${fracTyped}<span class="ghost">${fracGhost}</span></span>${hasComma ? '<span class="caret"></span>' : ''}</span></div>

function keyIn(v) {
  const d = S.sheet.d;
  let a = d.amt;
  if (v === 'del') a = a.slice(0, -1);
  else if (v === ',') { if (!a.includes(',')) a = (a || '0') + ','; }
  else {
    const [i, f] = a.split(',');
    if (a.includes(',')) { if ((f || '').length < 2) a += v; }
    else if ((i || '').length < 9) a = (a === '0' ? '' : a) + v;
  }
  d.amt = a; d.error = '';
  renderSheet();
}
function saveTx() {
  const d = S.sheet.d, cents = amtCents(d.amt);
  if (cents <= 0) { d.error = 'Digite um valor maior que zero.'; renderSheet(); $('#kp-1') && $('#kp-1').focus(); return; }
  if (d.kind !== 'transfer' && !d.cat) { d.error = 'Escolha uma categoria para salvar.'; d.panel = null; renderSheet(); const f = $('#nt-cats .chip'); if (f) f.focus(); return; }
  if (d.kind === 'transfer' && d.acc === d.to) { d.error = 'Escolha contas diferentes para a transferência.'; renderSheet(); return; }
  const before = d.cat ? spentBy(d.cat) : 0;
  const tx = { id: nextId('t'), date: d.date, desc: d.desc.trim() || (d.kind === 'transfer' ? 'Transferência' : CATS[d.cat].name), kind: d.kind, cat: d.kind === 'transfer' ? null : d.cat, acc: d.acc, tag: d.tag || undefined };
  if (d.kind === 'transfer') tx.to = d.to;
  if (d.repeat === 'parcel' && d.kind === 'expense') { const per = Math.floor(cents / d.n); tx.cents = cents - per * (d.n - 1); tx.parcel = { cur: 1, of: d.n }; }
  else tx.cents = cents;
  if (d.repeat === 'monthly') tx.recur = 'monthly';
  if (d.repeat === 'weekly') tx.recur = 'weekly';
  S.txs.push(tx);
  const acc = accById(d.acc);
  if (acc) acc.bal += d.kind === 'income' ? tx.cents : -tx.cents;
  if (d.kind === 'transfer') accById(d.to).bal += tx.cents;
  const label = { expense: 'Despesa salva', income: 'Receita salva', transfer: 'Transferência salva' }[d.kind];
  closeSheet();
  render();
  const al = d.kind === 'expense' ? budgetAlert(d.cat, before) : null;
  toast(al ? `${label}. ${al.msg}` : label, al ? al.kind : '');
}

function confirmPay() {
  const card = cardById(S.sheet.card), amt = payAmount(), acc = accById(S.sheet.p.acc);

/* =========================================================
   Exportar CSV / importar OFX
   ========================================================= */
function exportCSV() {
  const rows = [['data','descricao','tipo','categoria','conta','valor','parcela','tag']];
  const kindPt = { expense: 'despesa', income: 'receita', transfer: 'transferencia', invoice: 'pagamento de fatura' };
  [...S.txs].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const signed = t.kind === 'expense' ? -t.cents : t.cents;
    const p = parts(signed);
    rows.push([t.date.split('-').reverse().join('/'), t.desc, kindPt[t.kind], t.cat ? CATS[t.cat].name : '', srcName(t.acc), (p.neg ? '-' : '') + p.int.replace(/\./g, '') + p.frac, t.parcel ? `${t.parcel.cur}/${t.parcel.of}` : '', t.tag || '']);
  });
  const csv = '﻿' + rows.map(r => r.map(v => /[;"\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(';')).join('\r\n');
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'lancamentos-2026-10.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { /* ambiente sem download */ }
  toast(`CSV exportado com ${rows.length - 1} lançamentos.`);
}
function parseOFX(text) {
  const out = [];
  const blocks = text.split(/<STMTTRN>/i).slice(1);
  blocks.forEach(b => {
    const get = n => { const m = b.match(new RegExp('<' + n + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
    const amt = parseFloat(get('TRNAMT').replace(',', '.'));
    const dt = get('DTPOSTED');
    if (!isFinite(amt) || dt.length < 8) return;
    out.push({ fitid: get('FITID'), date: `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`, cents: Math.round(Math.abs(amt) * 100), income: amt > 0, desc: (get('MEMO') || get('NAME') || 'Lançamento importado') });
  });
  return out;
}
function importOFX(text) {
  const items = parseOFX(text);
  if (!items.length) { toast('Não encontramos lançamentos neste arquivo. Confira se é um OFX do banco.', 'danger'); return; }
  let added = 0, skipped = 0;
  items.forEach(it => {
    if (S.txs.some(t => t.fitid && t.fitid === it.fitid)) { skipped++; return; }
    const desc = it.desc.toLowerCase().replace(/(^|\s)\S/g, s => s.toUpperCase());
    const kind = it.income ? 'income' : 'expense';
    const cat = suggestCat(desc, kind) || (it.income ? 'outros' : 'outros');
    S.txs.push({ id: nextId('t'), date: it.date, desc, cents: it.cents, kind, cat, acc: 'nu', fitid: it.fitid, tag: undefined });
    accById('nu').bal += it.income ? it.cents : -it.cents;
    added++;
  });
  render();
  toast(added ? `${added} ${added === 1 ? 'lançamento importado' : 'lançamentos importados'}${skipped ? `, ${skipped} repetidos ignorados` : ''}.` : 'Esses lançamentos já tinham sido importados.');
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer;
function toast(msg, kind = '') {
  const t = $('#toast');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !$('#device').contains(el)) return;
  const act = el.dataset.act, v = el.dataset.v;
  const d = S.sheet && S.sheet.d;
  switch (act) {
    case 'tab': go({ home: 'home.dashboard', transactions: 'transactions.list', plan: 'plan.' + S.planTab, wallet: 'wallet.' + S.walletTab }[v]); break;
    case 'nav': go(v); break;
    case 'open-new': openSheet('new'); break;
    case 'close-sheet': closeSheet(); break;
    case 'hide': S.hidden = !S.hidden; render(); break;

    case 'ob-next': {
      if (S.obStep === 2) {
        if (!S.ob.name.trim()) { S.ob.error = 'Dê um nome à conta.'; render(); $('#ob-name').focus(); return; }
        S.ob.error = '';
      }
      if (S.obStep < 3) { S.obStep++; render(true); }
      else {
        const a = S.accounts[0];
        a.name = S.ob.name.trim(); a.type = S.ob.type;
        if (S.ob.balance) a.bal = parseReais(S.ob.balance);
        S.settings.faceId = S.ob.faceId; S.settings.remind = S.ob.remind;
        go('home.dashboard');
        toast('Tudo pronto. Comece registrando um gasto no botão +.');
      }
      break;
    }
    case 'ob-back': S.obStep = Math.max(1, S.obStep - 1); render(true); break;
    case 'ob-type': S.ob.type = v; render(); break;
    case 'ob-toggle': S.ob[v] = !S.ob[v]; render(); break;

    case 'q-clear': S.f.q = ''; render(); $('#q').focus(); break;
    case 'qtype': S.f.type = S.f.type === v ? 'all' : v; render(); break;
    case 'open-filters': openSheet('filters'); break;
    case 'f-set': S.f[el.dataset.k] = v; renderSheet(); render(); break;
    case 'f-toggle': { const arr = S.f[el.dataset.k]; const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); renderSheet(); render(); break; }
    case 'clear-filters': S.f = { q: '', period: 'month', type: 'all', accounts: [], cats: [], min: '', max: '', tag: '' }; if (S.sheet) renderSheet(); render(); if (!S.sheet) { const q = $('#q'); if (q) q.focus(); } break;

    case 'plan-tab': S.planTab = v; render(); $('#pt-' + v).focus(); break;
    case 'wallet-tab': S.walletTab = v; render(); $('#wt-' + v).focus(); break;

    case 'cal-day': S.cal.day = (+v && S.cal.day !== +v) ? +v : null; render(); break;
    case 'cal-month': S.cal.month = Math.min(10, Math.max(9, S.cal.month + +v)); S.cal.day = null; render(); break;
    case 'bill-pay': {
      const b = S.bills.find(x => x.id === v);
      if (b.card) { S.inv = { card: b.card, off: 0 }; openSheet('pay', { card: b.card }); break; }
      const before = b.receive ? 0 : spentBy(b.cat);
      b.paid = true;
      const kind = b.receive ? 'income' : 'expense';
      S.txs.push({ id: nextId('t'), date: TODAY, desc: b.name, cents: b.cents, kind, cat: b.cat, acc: 'nu' });
      accById('nu').bal += b.receive ? b.cents : -b.cents;
      render();
      const al = !b.receive ? budgetAlert(b.cat, before) : null;
      const msg = b.receive ? 'Recebimento registrado no Nubank.' : 'Pagamento registrado no Nubank.';
      toast(al ? `${msg} ${al.msg}` : msg, al ? al.kind : '');
      const next = $('#plan-panel .btn-small') || $('#h'); if (next) next.focus();
      break;
    }
    case 'goal-open': openSheet('goal', { goal: v }); break;
    case 'goal-amt': S.sheet.g.amt = +v; renderSheet(); break;
    case 'goal-acc': S.sheet.g.acc = v; renderSheet(); break;
    case 'goal-confirm': {
      const g = S.goals.find(x => x.id === S.sheet.goal), st = S.sheet.g;
      g.saved += st.amt; accById(st.acc).bal -= st.amt;
      closeSheet(); render();
      toast(`${money(st.amt, { force: true })} guardados em ${g.name}.`);
      break;
    }

    case 'invoice': S.inv = { card: v, off: 0 }; S.route = 'invoice'; render(true); break;
    case 'inv-off': S.inv.off = +v; render(); $('#io-' + (+v + 1)).focus(); break;
    case 'pay-open': S.inv.card = v; openSheet('pay', { card: v }); break;
    case 'pay-opt': S.sheet.p.opt = v; renderSheet(); if (v === 'other') { const i = $('#pay-other'); if (i) i.focus(); } break;
    case 'pay-acc': S.sheet.p.acc = v; renderSheet(); break;
    case 'pay-confirm': confirmPay(); break;

    case 'set-toggle': S.settings[v] = !S.settings[v]; render(); toast(v === 'faceId' ? (S.settings.faceId ? 'Face ID ativado.' : 'Face ID desativado.') : (S.settings.remind ? 'Lembretes ativados.' : 'Lembretes desativados.')); break;
    case 'theme': setThemePref(v); render(); break;
    case 'export': exportCSV(); break;
    case 'import': $('#ofxfile').click(); break;
    case 'import-sample': importOFX(SAMPLE_OFX); break;
    case 'unlock': S.locked = false; render(true); toast('Desbloqueado com Face ID.'); break;
    case 'unlock-pin': toast('No app, aqui abre o teclado do código de 6 dígitos.'); break;

    /* Novo lançamento */
    case 'kp': keyIn(v); break;
    case 'nkind': d.kind = v; d.error = ''; d.panel = null; if (v === 'income' && !INC_CATS.includes(d.cat)) d.cat = null; if (v === 'expense' && d.cat && CATS[d.cat].income) d.cat = null; if (v !== 'expense' && cardById(d.acc)) d.acc = 'nu'; if (v !== 'expense' && d.repeat === 'parcel') d.repeat = 'none'; if (v === 'transfer' && d.to === d.acc) d.to = S.accounts.find(a => a.id !== d.acc).id; renderSheet(); break;
    case 'pick-cat': d.cat = v; d.suggested = false; d.error = ''; renderSheet(); break;
    case 'panel': { const prev = d.panel; d.panel = (v && d.panel !== v) ? v : null; renderSheet(); const t = d.panel ? $('#panel-t') : $('#pill-' + (prev || 'acc')); if (t) t.focus(); break; }
    case 'pick-acc': if (d.panel === 'to') d.to = v; else { d.acc = v; if (d.kind === 'transfer' && d.to === v) d.to = S.accounts.find(a => a.id !== v).id; } renderSheet(); break;
    case 'pick-date': d.date = v; renderSheet(); break;
    case 'pick-repeat': d.repeat = v; if (v === 'parcel' && d.kind !== 'expense') d.kind = 'expense'; renderSheet(); break;
    case 'n': d.n = Math.min(24, Math.max(2, d.n + +v)); renderSheet(); break;
    case 'pick-tag': d.tag = v; renderSheet(); break;
    case 'save-tx': saveTx(); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (!k) return;
  const d = S.sheet && S.sheet.d;
  switch (k) {
    case 'ob-name': S.ob.name = el.value; break;
    case 'ob-bal': S.ob.balance = el.value; break;
    case 'q':
      S.f.q = el.value;
      $('#txlist').innerHTML = txListHtml();
      $('#txsum').textContent = txSummary();
      break;
    case 'f-min': case 'f-max':
      S.f[k === 'f-min' ? 'min' : 'max'] = el.value;
      { const n = filteredTx().length; $('#f-count').textContent = `Mostrar ${n} ${n === 1 ? 'lançamento' : 'lançamentos'}`; }
      render();
      break;
    case 'nt-desc': {
      d.desc = el.value;
      if (d.kind !== 'transfer' && (!d.cat || d.suggested)) {
        const s = suggestCat(el.value, d.kind);
        if (s !== d.cat) { d.cat = s; d.suggested = !!s; const pos = el.selectionStart; renderSheet(); const i = $('#nt-desc'); i.focus(); i.setSelectionRange(pos, pos); }
      }
      break;
    }
    case 'nt-tag': d.tag = el.value.trim().toLowerCase().replace(/^#/, ''); break;
    case 'pay-other': S.sheet.p.other = el.value; { const pos = el.selectionStart; renderSheet(); const i = $('#pay-other'); i.focus(); i.setSelectionRange(pos, pos); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (k === 'nt-date' && el.value) { S.sheet.d.date = el.value; renderSheet(); }
  if (k === 'lockAfter' || k === 'remindDays') { S.settings[k] = el.value; }
  if (k === 'nt-tag') renderSheet();
});

document.addEventListener('keydown', e => {
  if (S.sheet) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Tab') {
      const f = $$('#sheet button:not([disabled]), #sheet input, #sheet select, #sheet [tabindex="0"]').filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      else if (!$('#sheet').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      return;
    }
    if (S.sheet.kind === 'new' && !S.sheet.d.panel && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keyIn(e.key); }
      else if (e.key === ',' || e.key === '.') { e.preventDefault(); keyIn(','); }
      else if (e.key === 'Backspace') { e.preventDefault(); keyIn('del'); }
      else if (e.key === 'Enter' && document.activeElement.id === 'sheet-title') { e.preventDefault(); saveTx(); }
    }
    return;
  }
  /* Setas em tablists (padrão WAI-ARIA) */
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const tabs = $$('[role="tab"]', tab.parentElement);
    const i = tabs.indexOf(tab), n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    e.preventDefault(); n.click();
  }
});

$('#ofxfile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => importOFX(String(r.result));
  r.onerror = () => toast('Não foi possível ler o arquivo.', 'danger');
  r.readAsText(file, 'latin1');
  e.target.value = '';
});

/* =========================================================
   Controles da página (fora do iPhone)
   ========================================================= */
function applyTheme() {
  const pref = S.themePref;
  const eff = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
  document.documentElement.dataset.theme = eff;
  $$('input[name="theme"]').forEach(r => r.checked = r.value === eff);
}
function setThemePref(p) { S.themePref = p; applyTheme(); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.themePref === 'system') applyTheme(); });
$$('input[name="theme"]').forEach(r => r.addEventListener('change', () => { setThemePref(r.value); render(); if (S.sheet) renderSheet(); }));
$$('input[name="device"]').forEach(r => r.addEventListener('change', () => {
  S.device = r.value; $('#device').dataset.device = r.value; fit(); render(); if (S.sheet) renderSheet();
}));
$('#jump').innerHTML = SCREENS.map(([id, l]) => `<option value="${id}">${l} (${id})</option>`).join('');
$('#jump').addEventListener('change', e => go(e.target.value));
$('#reset').addEventListener('click', () => {
  const dev = S.device, pref = S.themePref;
  closeSheet(true);
  S = initialState(); S.device = dev; S.themePref = pref;
  go('onboarding.welcome');
});

function fit() {
  const dev = $('#device'), sc = $('#scaler');
  const w = dev.offsetWidth, h = dev.offsetHeight;
  const availH = window.innerHeight - $('.toolbar').offsetHeight - 40;
  const availW = window.innerWidth - 24;
  const s = Math.max(0.5, Math.min(1, availH / h, availW / w));
  dev.style.transform = `scale(${s})`;
  sc.style.width = w * s + 'px';
  sc.style.height = h * s + 'px';
}
window.addEventListener('resize', fit);

/* Init */
S.device = 'i16pm';
try {
  const q = new URLSearchParams(location.search).get('device');
  if (q && DEVICE_W[q]) {
    S.device = q;
    $('#device').dataset.device = q;
    const radio = document.querySelector(`input[name="device"][value="${q}"]`);
    if (radio) radio.checked = true;
  }
} catch (e) {}
applyTheme();
fit();
render(true);
window.__proto = { get state() { return S; }, go, render };
})();
</script>
