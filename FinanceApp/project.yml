# XcodeGen: gera FinanceApp.xcodeproj a partir deste arquivo.
#   brew install xcodegen && cd FinanceApp && xcodegen
# O .xcodeproj é um artefato gerado (não versione). Edite SEMPRE este arquivo.
name: FinanceApp

options:
  bundleIdPrefix: com.example
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: pt-BR
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: ABCDE12345       # defina o seu Team ID para rodar em aparelho real
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  FinanceApp:
    type: application
    platform: iOS
    # Core (regras financeiras, sem UI) + App (SwiftUI, Store, Logic, Services) compilam no MESMO módulo.
    sources:
      - path: Core
      - path: App
      - path: Assets
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: Assets/Info.plist
      properties:
        CFBundleDevelopmentRegion: pt-BR
        CFBundleDisplayName: Finanças
        CFBundleLocalizations: [pt-BR]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: O Finanças usa a câmera só para ler o QR Code da nota fiscal (NFC-e). A imagem não é gravada nem enviada.
        NSFaceIDUsageDescription: O Finanças usa o Face ID para proteger seus dados financeiros quando você abre o app.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    # App Group: o app grava o resumo que os widgets leem. Exige a capability App Groups (ver docs/app-store-checklist.md).
    # Para o iCloud/CloudKit, siga docs/cloudkit-setup.md e descomente as duas chaves do iCloud abaixo.
    entitlements:
      path: Assets/FinanceApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.financas]
        # com.apple.developer.icloud-container-identifiers: [iCloud.com.example.financas]
        # com.apple.developer.icloud-services: [CloudKit]
    dependencies:
      - target: FinanceWidgets
        embed: true
      # Apple Watch: descomente para embutir o app do relógio no app do iPhone (exige o runtime watchOS instalado no Xcode,
      # um App ID do relógio e a capability App Groups). NÃO verificado: o runtime watchOS não estava instalado ao escrever isto.
      # - target: FinanceWatch
      #   embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financas
        PRODUCT_NAME: FinanceApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Depois de configurar a capability iCloud/CloudKit, habilite a sincronização acrescentando CLOUDKIT_ENABLED:
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CLOUDKIT_ENABLED"

  # Widgets (WidgetKit): saldo, gastos do dia e próximo vencimento. Lê o resumo gravado no App Group.
  FinanceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Core                      # SharedContainer, WidgetSnapshot, Money, FinanceCalendar (sem UI)
      - path: Assets/Assets.xcassets    # tokens de cor claro/escuro
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Finanças
        CFBundleDevelopmentRegion: pt-BR
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FinanceWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.financas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financas.widgets
        PRODUCT_NAME: FinanceWidgets
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Apple Watch (NÃO executado: sem relógio/simulador pareado nesta sessão). App simples + complicação. O iPhone envia o
  # WidgetSnapshot por WatchConnectivity. Para embutir no app do iPhone, descomente a dependência em FinanceApp (ver README).
  FinanceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/App
      - path: Core
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: Finanças
        CFBundleDevelopmentRegion: pt-BR
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.financas
        NSMicrophoneUsageDescription: O Finanças usa o microfone para você ditar uma despesa no relógio.
    entitlements:
      path: Watch/App/FinanceWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.financas]
    dependencies:
      - target: FinanceWatchComplication
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financas.watchkitapp
        PRODUCT_NAME: FinanceWatch
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SWIFT_VERSION: "6.0"

  FinanceWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Complication
      - path: Core
    info:
      path: Watch/Complication/Info.plist
      properties:
        CFBundleDisplayName: Finanças
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch/Complication/FinanceWatchComplication.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.financas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financas.watchkitapp.complication
        PRODUCT_NAME: FinanceWatchComplication
        SKIP_INSTALL: YES
        SDKROOT: watchos

  FinanceAppTests:
    type: bundle.unit-test
    platform: iOS
    # AppTests/Runner/main.swift é o executável de swiftc (scripts/test-app.sh); não entra no bundle do Xcode.
    sources:
      - path: AppTests
        excludes:
          - Runner/**
    dependencies:
      - target: FinanceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financas.tests
        GENERATE_INFOPLIST_FILE: YES

  FinanceAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FinanceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financas.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FinanceApp:
    build:
      targets:
        FinanceApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FinanceAppTests
        - FinanceAppUITests
    profile:
      config: Release
    archive:
      config: Release
