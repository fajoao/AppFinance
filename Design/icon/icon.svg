<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14808A"/>
      <stop offset="1" stop-color="#083F46"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE3E6"/>
      <stop offset="1" stop-color="#4FB8BD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- barras ascendentes: leitura imediata de crescimento financeiro -->
  <rect x="206" y="560" width="164" height="214" rx="46" fill="#EEF2EF" opacity="0.92"/>
  <rect x="430" y="452" width="164" height="322" rx="46" fill="#EEF2EF"/>
  <rect x="654" y="228" width="164" height="546" rx="46" fill="url(#mint)"/>
  <!-- moeda sobre a barra mais alta -->
  <circle cx="736" cy="182" r="64" fill="#EEF2EF"/>
  <circle cx="736" cy="182" r="40" fill="none" stroke="#0D5C63" stroke-width="14"/>
  <!-- linha de base -->
  <rect x="170" y="812" width="684" height="22" rx="11" fill="#EEF2EF" opacity="0.55"/>
</svg>
